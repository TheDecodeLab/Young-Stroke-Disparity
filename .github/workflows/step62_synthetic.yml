name: Step62 synthetic cohort validation

on:
  push:
    branches:
      - analysis-rebuild-phase1-audit
    paths:
      - "scripts/step62_checkpointed_cohort.py"
      - "tests/test_step62_checkpointed_cohort.py"
      - ".github/workflows/step62_synthetic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Compile Step62
        run: python -m py_compile scripts/step62_checkpointed_cohort.py
      - name: Run only fully fabricated synthetic tests
        run: python -m pytest -q tests/test_step62_checkpointed_cohort.py
