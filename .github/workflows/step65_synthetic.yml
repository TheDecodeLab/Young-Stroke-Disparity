name: Step65 synthetic date-provenance audit

on:
  push:
    branches:
      - analysis-rebuild-phase1-audit
    paths:
      - "scripts/step65_date_provenance_audit.py"
      - "tests/test_step65_date_provenance_audit.py"
      - ".github/workflows/step65_synthetic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Compile script
        run: python -m py_compile scripts/step65_date_provenance_audit.py
      - name: Run synthetic-only tests
        run: python -m pytest -q tests/test_step65_date_provenance_audit.py
