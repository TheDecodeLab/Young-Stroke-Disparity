name: Step69 synthetic same-day encounter attachment QA

on:
  push:
    branches:
      - analysis-rebuild-phase1-audit
    paths:
      - "scripts/step69_same_day_attachment_diagnostics.py"
      - "tests/test_step69_same_day_attachment_diagnostics.py"
      - ".github/workflows/step69_synthetic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fabricated-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Compile
        run: python -m py_compile scripts/step69_same_day_attachment_diagnostics.py
      - name: Test synthetic only
        run: python -m pytest -q tests/test_step69_same_day_attachment_diagnostics.py
