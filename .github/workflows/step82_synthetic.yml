name: Step82 paired demographic sensitivity fabricated checks
on:
  push:
    branches: [analysis-rebuild-phase1-audit]
    paths:
      - scripts/step82_demographic_definition_sensitivity.py
      - tests/test_step82_demographic_definition_sensitivity.py
      - .github/workflows/step82_synthetic.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fabricated_only:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile scripts/step82_demographic_definition_sensitivity.py
      - run: python -m pytest -q tests/test_step82_demographic_definition_sensitivity.py
