name: Step75 fabricated PCS imaging-section denominator audit

on:
  push:
    branches:
      - analysis-rebuild-phase1-audit
    paths:
      - "scripts/step75_pcs_section_denominator_audit.py"
      - "tests/test_step75_pcs_section_denominator_audit.py"
      - ".github/workflows/step75_synthetic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fabricated-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install test/scientific requirements
        run: python -m pip install -r requirements.txt
      - name: Syntax check
        run: python -m py_compile scripts/step75_pcs_section_denominator_audit.py
      - name: Fabricated-only PCS sections and report tests
        run: python -m pytest -q tests/test_step75_pcs_section_denominator_audit.py
