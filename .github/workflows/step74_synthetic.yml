name: Step74 CMS PCS synthetic classification checks

on:
  push:
    branches:
      - analysis-rebuild-phase1-audit
    paths:
      - "scripts/step74_cms_pcs_codebook_review.py"
      - "tests/test_step74_cms_pcs_codebook_review.py"
      - ".github/workflows/step74_synthetic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fabricated-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install scientific requirements
        run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m py_compile scripts/step74_cms_pcs_codebook_review.py
      - name: Tests (public/synthetic only; no CMS HTTP)
        run: python -m pytest -q tests/test_step74_cms_pcs_codebook_review.py
