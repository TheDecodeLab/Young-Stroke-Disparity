name: Step76 fabricated-only exact PCS anatomy review

on:
  push:
    branches:
      - analysis-rebuild-phase1-audit
    paths:
      - "scripts/step76_exact_PCS_anatomy_review.py"
      - "tests/test_step76_exact_PCS_anatomy_review.py"
      - ".github/workflows/step76_synthetic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install test and scientific dependencies
        run: python -m pip install -r requirements.txt
      - name: Check syntax
        run: python -m py_compile scripts/step76_exact_PCS_anatomy_review.py
      - name: Run fabricated clinical coding fixtures
        run: python -m pytest -q tests/test_step76_exact_PCS_anatomy_review.py
