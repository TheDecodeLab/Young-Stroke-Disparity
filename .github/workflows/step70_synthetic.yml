name: Step70 synthetic P-quarantine standardization

on:
  push:
    branches:
      - analysis-rebuild-phase1-audit
    paths:
      - "scripts/step69_same_day_attachment_diagnostics.py"
      - "scripts/step70_P_quarantine_standardization.py"
      - "tests/test_step69_same_day_attachment_diagnostics.py"
      - "tests/test_step70_P_quarantine_standardization.py"
      - ".github/workflows/step70_synthetic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fabricated-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Syntax checks
        run: |
          python -m py_compile scripts/step69_same_day_attachment_diagnostics.py
          python -m py_compile scripts/step70_P_quarantine_standardization.py
      - name: Synthetic tests
        run: python -m pytest -q tests/test_step69_same_day_attachment_diagnostics.py tests/test_step70_P_quarantine_standardization.py
