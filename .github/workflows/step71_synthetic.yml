name: Step71 synthetic demographic outcome feasibility

on:
  push:
    branches:
      - analysis-rebuild-phase1-audit
    paths:
      - "scripts/step71_demographic_capture_feasibility.py"
      - "tests/test_step71_demographic_capture_feasibility.py"
      - ".github/workflows/step71_synthetic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fabricated-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Compile
        run: python -m py_compile scripts/step71_demographic_capture_feasibility.py
      - name: Fabricated tests
        run: python -m pytest -q tests/test_step71_demographic_capture_feasibility.py
